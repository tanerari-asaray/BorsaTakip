services:
  - type: web
    name: borsatakip-production-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TRADEWIZE_API_KEY
        sync: false
      - key: TRADEWIZE_ACCESS_TOKEN
        sync: false
      - key: SCANNER_SYMBOLS
        value: ""
      - key: SCANNER_MAX_SYMBOLS
        value: "1000"
      - key: SCANNER_BATCH_SIZE
        value: "60"
      - key: SCANNER_INTERVAL
        value: "5m"
      - key: SCANNER_HISTORY_BARS
        value: "120"
      - key: CAPABILITY_CACHE_SECONDS
        value: "10"
      - key: APP_API_KEY
        sync: false
      - key: MAX_DATA_AGE_MS
        value: "30000"
