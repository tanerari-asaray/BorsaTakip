services:
  - type: web
    name: borsatakip-production-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TRADEWIZE_API_KEY
        sync: false
      - key: TRADEWIZE_ACCESS_TOKEN
        sync: false
      - key: SCANNER_SYMBOLS
        value: "THYAO,ASELS,AKBNK,EREGL,SISE,TUPRS,BIMAS,KCHOL,SAHOL,TCELL,PGSUS,TOASO,FROTO,GARAN,ISCTR,YKBNK,HALKB,VAKBN,KOZAL,KOZAA"
      - key: SCANNER_MAX_SYMBOLS
        value: "30"
      - key: APP_API_KEY
        sync: false
      - key: MAX_DATA_AGE_MS
        value: "30000"
