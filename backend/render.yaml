services:
  - type: web
    name: borsatakip-production-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TRADEWIZE_ACCESS_TOKEN
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: MAX_DATA_AGE_MS
        value: "30000"
