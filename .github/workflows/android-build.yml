name: BorsaTakip Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, v5.4.0-apk ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project from repository sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workspace
          mkdir -p workspace
          unzip -q V5.1.33-.zip -d workspace
          if [ -d workspace/ci/b124-overlay ]; then
            cp -a ci/b124-overlay/. workspace/
          fi
          echo "Project files:"
          find workspace -maxdepth 3 -type f | sort | head -200
          test -f workspace/gradlew
          test -f workspace/settings.gradle.kts || test -f workspace/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          ./gradlew --version
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Locate and verify APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/build/outputs/apk/**/*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/BorsaTakip-debug.apk
          sha256sum ../artifacts/BorsaTakip-debug.apk | tee ../artifacts/APK-SHA256.txt
          ls -lh ../artifacts/BorsaTakip-debug.apk

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging artifacts/BorsaTakip-debug.apk | tee artifacts/APK-BADGING.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
