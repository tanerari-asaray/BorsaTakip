name: BorsaTakip V5.3.5 APK Build

on:
  workflow_dispatch:
  push:
    branches: [ v5.4.0-apk ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build-v535:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5.3.5 source
        uses: actions/checkout@v4

      - name: Validate V5.3.5 source
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f gradlew
          grep -q 'versionCode = 535' app/build.gradle.kts
          grep -q 'versionName = "5.3.5"' app/build.gradle.kts
          grep -q 'namespace = "tr.borsatakip.v5"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run V5.3.5 unit tests
        run: ./gradlew clean testDebugUnitTest --stacktrace

      - name: Build V5.3.5 debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/BorsaTakip-V5.3.5-debug.apk
          sha256sum artifacts/BorsaTakip-V5.3.5-debug.apk | tee artifacts/APK-SHA256.txt

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/BorsaTakip-V5.3.5-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee artifacts/APK-BADGING.txt
          grep -q "package: name='tr.borsatakip.v5'" artifacts/APK-BADGING.txt
          grep -q "versionCode='535'" artifacts/APK-BADGING.txt
          grep -q "versionName='5.3.5'" artifacts/APK-BADGING.txt
          "$APKSIGNER" verify --verbose "$APK" | tee artifacts/APK-SIGNATURE.txt

      - name: Build report
        shell: bash
        run: |
          {
            echo "# BorsaTakip V5.3.5 GitHub APK Build"
            echo
            echo "- Repository: tanerari-asaray/BorsaTakip"
            echo "- Branch: v5.4.0-apk"
            echo "- Commit: $GITHUB_SHA"
            echo "- versionCode: 535"
            echo "- versionName: 5.3.5"
            echo "- applicationId: tr.borsatakip.v5"
            echo "- Build: assembleDebug"
            echo "- Unit tests: testDebugUnitTest"
            echo "- Physical device test: NOT RUN"
            echo "- Production backend E2E: NOT RUN"
            echo
            echo "## SHA-256"
            cat artifacts/APK-SHA256.txt
          } | tee artifacts/V5.3.5-GITHUB-BUILD-REPORT.md

      - name: Upload V5.3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.3.5-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
