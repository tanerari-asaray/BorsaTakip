name: BorsaTakip V5.2.5 B124 CORRECTED-V4 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'
  BORSA_BACKEND_URL: ${{ vars.BORSA_BACKEND_URL }}
  BORSA_PRODUCTION_BACKEND_URL: ${{ vars.BORSA_PRODUCTION_BACKEND_URL }}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand B124 base source
        shell: bash
        run: |
          set -euo pipefail
          test -f V5.1.33-.zip
          rm -rf _source
          unzip -q V5.1.33-.zip -d _source
          cp -R _source/. .

      - name: Apply B124 CORRECTED-V4 overlay
        shell: bash
        run: |
          set -euo pipefail
          test -d ci/b124-overlay
          cp -R ci/b124-overlay/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Verify provisioned Gradle
        shell: bash
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version

      - name: Run clean build and JVM unit tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          gradle clean 2>&1 | tee artifacts/gradle-clean.log
          CLEAN_STATUS=${PIPESTATUS[0]}
          gradle testDebugUnitTest --stacktrace 2>&1 | tee artifacts/gradle-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          gradle assembleDebug --stacktrace 2>&1 | tee artifacts/gradle-assemble.log
          BUILD_STATUS=${PIPESTATUS[0]}
          {
            echo "gradle clean exit: $CLEAN_STATUS"
            echo "gradle testDebugUnitTest exit: $TEST_STATUS"
            echo "gradle assembleDebug exit: $BUILD_STATUS"
          } | tee artifacts/gradle-status.txt
          if [ "$CLEAN_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-build-diagnostics
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" "artifacts/BorsaTakip-V5.2.5-B124-CORRECTED-V4-debug.apk"
          sha256sum "artifacts/BorsaTakip-V5.2.5-B124-CORRECTED-V4-debug.apk" | tee artifacts/APK-SHA256.txt

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/BorsaTakip-V5.2.5-B124-CORRECTED-V4-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$AAPT" dump badging "$APK" | tee artifacts/APK-BADGING.txt
          grep -q "package: name='tr.borsatakip.v5'" artifacts/APK-BADGING.txt
          grep -q "versionCode='124'" artifacts/APK-BADGING.txt
          grep -q "versionName='5.2.5'" artifacts/APK-BADGING.txt
          "$APKSIGNER" verify --verbose "$APK" | tee artifacts/APK-SIGNATURE.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee artifacts/APK-ZIPALIGN.txt

      - name: Count discovered source tests
        shell: bash
        run: |
          set -euo pipefail
          JVM_COUNT="$(grep -Rho '@Test' app/src/test 2>/dev/null | wc -l | tr -d ' ')"
          ANDROID_COUNT="$(grep -Rho '@Test' app/src/androidTest 2>/dev/null | wc -l | tr -d ' ')"
          {
            echo "JVM static @Test count: ${JVM_COUNT}"
            echo "Android instrumentation static @Test count: ${ANDROID_COUNT}"
            echo "Static total: $((JVM_COUNT + ANDROID_COUNT))"
          } | tee artifacts/TEST-STATIC-COUNT.txt

      - name: Build verification report
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/BorsaTakip-V5.2.5-B124-CORRECTED-V4-debug.apk"
          {
            echo '# B124-V4 GitHub Build Report'
            echo
            echo '## Source'
            echo '- Repository: tanerari-asaray/BorsaTakip'
            echo '- Branch: main'
            echo "- Commit SHA: ${GITHUB_SHA}"
            echo '- versionCode: 124'
            echo '- versionName: 5.2.5'
            echo '- JDK: 17'
            echo '- Gradle: 8.11.1'
            echo
            echo '## Unit Tests'
            cat artifacts/TEST-STATIC-COUNT.txt
            echo '- Executed: see Gradle test task result above'
            echo
            echo '## Instrumentation Tests'
            echo '- NOT RUN in this APK job'
            echo
            echo '## APK'
            echo "- File: $(basename "$APK")"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo "- SHA-256: $(cut -d' ' -f1 artifacts/APK-SHA256.txt)"
            echo '- applicationId: tr.borsatakip.v5'
            echo '- versionCode: 124'
            echo '- versionName: 5.2.5'
            echo '- Signing: DEBUG'
            echo
            echo '## Verification'
            echo '- assembleDebug: PASS if this step executed'
            echo '- APK metadata: PASS if this step executed'
            echo '- APK signature: PASS if this step executed'
            echo '- zipalign: PASS if this step executed'
            echo '- Production backend E2E: NOT RUN'
            echo '- Physical device test: NOT RUN'
          } | tee artifacts/B124-V4-GITHUB-BUILD-REPORT.md

      - name: Upload real APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-B124-CORRECTED-V4-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
