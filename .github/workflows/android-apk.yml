name: Build BorsaTakip APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Expand source archive
        if: ${{ hashFiles('V5.1.33-CAGHT6-DUZELTILMIS-KAYNAK-KOD.zip') != '' }}
        run: |
          unzip -q V5.1.33-CAGHT6-DUZELTILMIS-KAYNAK-KOD.zip -d _source
          cp -R _source/. .

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.33-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
