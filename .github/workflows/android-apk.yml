name: Build BorsaTakip APK

on:
  workflow_dispatch:
  push:
    branches: [ main, build/apk-update ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source archive
        if: ${{ hashFiles('V5.1.33-.zip') != '' }}
        run: |
          rm -rf _source
          unzip -q V5.1.33-.zip -d _source
          cp -R _source/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Apply V5.1.35 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if required and old not in s:
                  raise SystemExit(f'Expected block not found: {path}')
              p.write_text(s.replace(old,new,1))

          p=Path('app/build.gradle.kts'); s=p.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 85', s, count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "5.1.35"', s, count=1)
          old='''            check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }\n            signingConfig = signingConfigs.getByName("releaseSecure")'''
          new='''            val isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.contains("Release", ignoreCase = true) }\n            if (isReleaseTaskRequested) {\n                check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }\n                signingConfig = signingConfigs.getByName("releaseSecure")\n            }'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/analysis/OpportunityEngine.kt'); s=p.read_text()
          s=s.replace('''private data class Levels(val stop: Double, val target1: Double, val target2: Double, val riskReward: Double, val structuralTarget: Double?, val modelTarget1: Double, val modelTarget2: Double)''','''private data class Levels(val stop: Double, val target1: Double, val target2: Double, val riskReward: Double, val riskReward2: Double, val structuralTarget: Double?, val modelTarget1: Double, val modelTarget2: Double)''')
          s=s.replace('''val stop = maxOf(price - 1.25 * a, structural ?: Double.NEGATIVE_INFINITY).takeIf { it.isFinite() && it < price } ?: (price - 1.25 * a)''','''val structuralStop = structural?.minus(0.35 * a)\n                val modelStop = price - 1.25 * a\n                val stop = minOf(modelStop, structuralStop ?: modelStop).takeIf { it.isFinite() && it < price } ?: modelStop''')
          s=s.replace('''if (risk <= 0.0) null else Levels(stop, target1, target2, (target2 - price) / risk, structuralTarget, modelTarget1, modelTarget2)''','''if (risk <= 0.0) null else Levels(stop, target1, target2, (target1 - price) / risk, (target2 - price) / risk, structuralTarget, modelTarget1, modelTarget2)''')
          s=s.replace('''val stop = minOf(price + 1.25 * a, structural ?: Double.POSITIVE_INFINITY).takeIf { it.isFinite() && it > price } ?: (price + 1.25 * a)''','''val structuralStop = structural?.plus(0.35 * a)\n                val modelStop = price + 1.25 * a\n                val stop = maxOf(modelStop, structuralStop ?: modelStop).takeIf { it.isFinite() && it > price } ?: modelStop''')
          s=s.replace('''if (risk <= 0.0) null else Levels(stop, target1, target2, (price - target2) / risk, structuralTarget, modelTarget1, modelTarget2)''','''if (risk <= 0.0) null else Levels(stop, target1, target2, (price - target1) / risk, (price - target2) / risk, structuralTarget, modelTarget1, modelTarget2)''')
          s=s.replace('''add("RR=${rr?.let { "%.4f".format(java.util.Locale.US, it) } ?: ""}")''','''add("RR1=${rr?.let { "%.4f".format(java.util.Locale.US, it) } ?: ""}")\n            levels?.let { add("RR2=${"%.4f".format(java.util.Locale.US, it.riskReward2)}") }''')
          s=s.replace('''rr?.let { reasons += "Risk/Ödül 1:${"%.2f".format(it)}" }''','''rr?.let { reasons += "Risk/Ödül RR1 1:${"%.2f".format(it)}" }\n        levels?.let { reasons += "Risk/Ödül RR2 1:${"%.2f".format(it.riskReward2)}" }''')
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/analysis/OpportunityDiscoveryPresentation.kt'); s=p.read_text()
          s=s.replace('''val catalystAvailable = x.kapLabel.isNotBlank() && !x.kapLabel.equals("Veri yok", true)''','''val catalystAvailable = x.kapLabel.isNotBlank() && !x.kapLabel.equals("Veri yok", true) && !x.kapLabel.equals("Doğrulanmadı", true) && x.kapLabel.startsWith("VERIFIED:", true)''')
          s=s.replace('''val classification = when {\n                coveragePct >= 70 && blended >= 85 && x.riskScore <= 40 -> "GÜÇLÜ AL"\n                coveragePct >= 60 && blended >= 72 && x.riskScore <= 55 -> "AL"\n                else -> "İZLE"\n            }''','''val technicalAvailable = available.size >= 5\n            val classification = when {\n                technicalAvailable && blended >= 82 && x.finalSignalScore >= 80 && x.direction.equals("LONG", true) && x.riskScore <= 40 -> "GÜÇLÜ AL"\n                technicalAvailable && blended >= 70 && x.finalSignalScore >= 70 && x.direction.equals("LONG", true) && x.riskScore <= 55 -> "AL"\n                else -> "İZLE"\n            }''')
          s=s.replace('''if (catalystAvailable) add("doğrulanmış katalizör")''','''if (catalystAvailable) add("doğrulanmış KAP/katalizör")\n                if (!catalystAvailable) add("katalizör verisi doğrulanmadı; teknik mod")''')
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/data/SettingsStore.kt'); s=p.read_text()
          s=s.replace('''putEncrypted("api_key_encrypted", normalized)\n            if (normalized.isBlank()) p.edit().remove("api_key_origin").apply()''','''val stored = putEncrypted("api_key_encrypted", normalized)\n            if (!stored) return\n            if (normalized.isBlank()) p.edit().remove("api_key_origin").apply()''')
          s=s.replace('''private fun putEncrypted(key: String, value: String) {''','''private fun putEncrypted(key: String, value: String): Boolean {''')
          s=s.replace('''p.edit().remove(key).apply()\n            return\n        }\n        encrypt(normalized)?.let { p.edit().putString(key, it).apply() }\n    }''','''p.edit().remove(key).apply()\n            return true\n        }\n        val encrypted = encrypt(normalized) ?: return false\n        p.edit().putString(key, encrypted).apply()\n        return true\n    }''')
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/data/ForwardOutcomeMatcher.kt'); s=p.read_text().replace('import java.time.ZonedDateTime\n','')
          old='''fun dueHorizons(signalGeneratedAt: Long, now: Long, alreadyPresent: Set<String> = emptySet()): Map<String, Long> =\n        horizons.filter { (name, horizon) -> name !in alreadyPresent && signalGeneratedAt > 0L && now >= signalGeneratedAt + horizon }'''
          new='''fun dueHorizons(signalGeneratedAt: Long, now: Long, alreadyPresent: Set<String> = emptySet()): Map<String, Long> =\n        horizons.filter { (name, horizon) -> name !in alreadyPresent && signalGeneratedAt > 0L && now >= tradingTargetTime(signalGeneratedAt, horizon) }\n\n    fun tradingTargetTime(signalGeneratedAt: Long, horizonMs: Long, zone: ZoneId = ZoneId.of("Europe/Istanbul")): Long {\n        if (signalGeneratedAt <= 0L) return 0L\n        var t = Instant.ofEpochMilli(signalGeneratedAt).atZone(zone).plusNanos(horizonMs * 1_000_000L)\n        while (!isTradingDay(t.dayOfWeek) || t.hour < 9 || (t.hour == 9 && t.minute < 40) || t.hour > 18 || (t.hour == 18 && t.minute > 10)) {\n            t = t.plusDays(1).withHour(9).withMinute(40).withSecond(0).withNano(0)\n            while (!isTradingDay(t.dayOfWeek)) t = t.plusDays(1)\n        }\n        return t.toInstant().toEpochMilli()\n    }\n\n    private fun isTradingDay(day: DayOfWeek): Boolean = day != DayOfWeek.SATURDAY && day != DayOfWeek.SUNDAY'''
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/data/SignalHistoryStore.kt'); s=p.read_text()
          s=s.replace('''list += DueWork(r.optString("id"),r.optString("symbol"),generatedAt,signalPrice,r.optString("direction"),due,due.minOf { generatedAt+it.value },due.maxOf { generatedAt+it.value+ForwardOutcomeMatcher.toleranceMs(it.key) })''','''list += DueWork(r.optString("id"), r.optString("symbol"), generatedAt, signalPrice, r.optString("direction"), due, due.minOf { ForwardOutcomeMatcher.tradingTargetTime(generatedAt, it.value) }, due.maxOf { ForwardOutcomeMatcher.tradingTargetTime(generatedAt, it.value) + ForwardOutcomeMatcher.toleranceMs(it.key) })''')
          s=s.replace('''val target=item.generatedAt+horizonMs; val matched=ForwardOutcomeMatcher.match(history,target,ForwardOutcomeMatcher.toleranceMs(name))''','''val target=ForwardOutcomeMatcher.tradingTargetTime(item.generatedAt,horizonMs); val matched=ForwardOutcomeMatcher.match(history,target,ForwardOutcomeMatcher.toleranceMs(name))''')
          p.write_text(s)

          p=Path('app/src/main/java/tr/borsatakip/v5/worker/OpportunityWorker.kt'); s=p.read_text()
          if 'import android.content.Intent' not in s: s=s.replace('import android.content.Context\n','import android.content.Context\nimport android.content.Intent\nimport android.app.PendingIntent\n')
          old='''if (hits.isNotEmpty()) {\n                notify(\n                    applicationContext,\n                    "BORSA TAKİP fırsat uyarısı",\n                    hits.take(3).joinToString(" • ") {\n                        "${it.symbol} ${it.direction} • Nihai Sinyal ${it.finalSignalScore}/100"\n                    }\n                )\n            }'''
          new='''if (hits.isNotEmpty()) {\n                val cp = applicationContext.getSharedPreferences("opportunity_notification_cooldown", Context.MODE_PRIVATE)\n                val now = System.currentTimeMillis()\n                val fresh = hits.filter { now - cp.getLong("${it.symbol}:${it.direction}", 0L) >= NOTIFICATION_COOLDOWN_MS }\n                if (fresh.isNotEmpty()) {\n                    fresh.forEach { cp.edit().putLong("${it.symbol}:${it.direction}", now).apply() }\n                    notify(applicationContext, fresh.take(3))\n                }\n            }'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('''fun notify(context: Context, title: String, text: String) {''','''private const val NOTIFICATION_COOLDOWN_MS = 60 * 60 * 1000L\n\n        fun notify(context: Context, hits: List<tr.borsatakip.v5.model.Opportunity>) {\n            val title = "BORSA TAKİP fırsat uyarısı"\n            val text = hits.joinToString(" • ") { "${it.symbol} ${it.direction} • Nihai Sinyal ${it.finalSignalScore}/100" }''')
          if 'val pending = PendingIntent' not in s:
              marker='''            nm.notify(5001, NotificationCompat.Builder(context,id)'''
              insert='''            val intent = Intent(context, tr.borsatakip.v5.ui.MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP; hits.firstOrNull()?.let { putExtra("symbol", it.symbol) } }\n            val pending = PendingIntent.getActivity(context, 5001, intent, PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0)\n            nm.notify(5001, NotificationCompat.Builder(context,id)'''
              s=s.replace(marker,insert,1)
          s=s.replace('''.setAutoCancel(true)\n                .build())''','''.setAutoCancel(true)\n                .setContentIntent(pending)\n                .build())''')
          p.write_text(s)
          PY

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f build.gradle.kts

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Package updated source
        run: |
          rm -rf _ci_source_archive
          mkdir _ci_source_archive
          cp -R app backend gradle.properties build.gradle.kts settings.gradle.kts _ci_source_archive/
          (cd _ci_source_archive && zip -qr ../BorsaTakip-V5.1.35-updated-source.zip .)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.35-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload updated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.35-updated-source
          path: BorsaTakip-V5.1.35-updated-source.zip
          if-no-files-found: error
