name: Build BorsaTakip APK

on:
  workflow_dispatch:
  push:
    branches: [ main, build/apk-update ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source archive
        run: |
          rm -rf _source
          unzip -q V5.1.33-.zip -d _source
          cp -R _source/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Prepare V5.1.35 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 85', s, count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "5.1.35"', s, count=1)
          old='''            check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }\n            signingConfig = signingConfigs.getByName("releaseSecure")'''
          new='''            val isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.contains("Release", ignoreCase = true) }\n            if (isReleaseTaskRequested) {\n                check(hasReleaseSigning) { "Release APK üretimi için güvenli imzalama değişkenleri zorunludur." }\n                signingConfig = signingConfigs.getByName("releaseSecure")\n            }'''
          s=s.replace(old,new,1)
          p.write_text(s)
          strings=Path('app/src/main/res/values/strings.xml')
          t=strings.read_text()
          t=t.replace("\\'", "'")
          strings.write_text(t)
          for path in Path('app/src/main/res/values').glob('*.xml'):
              t=path.read_text()
              t=t.replace("\\'", "'")
              path.write_text(t)
          PY

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f build.gradle.kts

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Package updated source
        run: |
          rm -rf _ci_source_archive
          mkdir _ci_source_archive
          cp -R app backend gradle.properties build.gradle.kts settings.gradle.kts _ci_source_archive/
          (cd _ci_source_archive && zip -qr ../BorsaTakip-V5.1.35-updated-source.zip .)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.35-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload updated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorsaTakip-V5.1.35-updated-source
          path: BorsaTakip-V5.1.35-updated-source.zip
          if-no-files-found: error
